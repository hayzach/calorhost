[project]
name = "calorhost"
version = "0.1.0"
requires-python = ">=3.14"
description = "A self-hosted calorie/macro tracker web app"
readme = "README.md"

dependencies = [
    "fastapi",
    "uvicorn",
    "jinja2",
    "openfoodfacts",
    "python-multipart==0.0.12"
]

[dependency-groups]
dev = [
    "ruff",
    "mypy"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/calorhost"]
include = [
    "src/calorhost/templates/**/*.html"
]

[project.scripts]
calorhost = "calorhost.main:run"


[tool.mypy]
strict = true
show_error_codes = true

[tool.ruff]
line-length = 120
exclude = [
    ".git",
    ".mypy_cache",
    ".pytest_cache",
    ".ruff_cache",
    ".venv",
    "dist",
    "docs",
]
lint.select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "S",  # flake8-bandit - we must ignore these rules in tests
    "C",  # flake8-comprehensions
    "B",  # flake8-bugbear
]
