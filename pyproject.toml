[project]
name = "calorhost"
version = "0.1.0"
requires-python = ">=3.14"
description = "A self-hosted calorie/macro tracker web app"
readme = "README.md"

dependencies = [
    "fastapi",
    "uvicorn",
    "jinja2",
    "openfoodfacts",
    "python-multipart==0.0.12"
]

[dependency-groups]
dev = [
    "ruff",
    "mypy"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/calorhost"]
include = [
    "src/calorhost/templates/**/*.html"
]

[project.scripts]
calorhost = "calorhost.main:run"


[tool.mypy]
strict = true
show_error_codes = true

[tool.ruff]
line-length = 120
exclude = [
    ".git",
    ".mypy_cache",
    ".pytest_cache",
    ".ruff_cache",
    ".venv",
    "dist",
    "docs",
]
lint.select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "G",   # flake8-logging-format
    "PIE", # flake8-pie
    "I",   # isort
]
