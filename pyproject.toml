[project]
name = "calorhost"
version = "0.1.0"
requires-python = ">=3.14"
description = "A self-hosted calorie/macro tracker web app"
readme = "README.md"

dependencies = [
    "fastapi",
    "uvicorn",
    "jinja2",
    "openfoodfacts",
    "requests",
    "python-multipart==0.0.12",
    "structlog",
    "sqlalchemy>=2.0",
    "alembic>=1.14"
]

[dependency-groups]
dev = [
    "ruff",
    "mypy",
    "pytest",
    "pytest-cov",
    "coverage",
    "httpx2"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/calorhost"]
include = [
    "src/calorhost/templates/**/*.html",
    "src/calorhost/migrations/**/*.mako"
]

[project.scripts]
calorhost = "calorhost.main:run"
calorhost-db = "calorhost.db_migrate:run"


[tool.mypy]
strict = true
show_error_codes = true
mypy_path = "src"

[tool.ruff]
line-length = 120
exclude = [
    ".git",
    ".mypy_cache",
    ".pytest_cache",
    ".ruff_cache",
    ".venv",
    "dist",
    "docs",
]
lint.select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "G",   # flake8-logging-format
    "PIE", # flake8-pie
    "I",   # isort
]

[tool.coverage.report]
show_missing = true
fail_under = 70

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "--cov=calorhost --cov-report=term-missing"
