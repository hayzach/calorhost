<p>Searching for {{ food_name }}!</p>

{% for result in food_results %}
    <li>name: {{ result.name }}</li>
    <li>calories: {{ result.calories }}</li>
    <li>protein: {{ result.protein }}</li>
    <li>carbohydrates: {{ result.carbohydrates }}</li>
    <li>fats: {{ result.fats }}</li>
{% endfor %}
