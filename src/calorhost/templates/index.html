<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FastAPI + HTMX Hello World</title>
    <script src="https://unpkg.com/htmx.org"></script>
</head>
<body>
    <h1>Hello world</h1>
    
    <form hx-post="/off-api-food-search" hx-target="#response">
        <label>
            Search for a food
            <input 
                type="text" 
                name="food" 
                placeholder="Enter a food" 
                required
            />
        </label>
        <button type="submit">Say Hello</button>
    </form>
    
    <div id="response"></div>
</body>
</html>
